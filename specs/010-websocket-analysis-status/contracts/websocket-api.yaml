## Testing

### Connection Test

```javascript
const ws = new WebSocket('ws://localhost:8000/ws/analysis-notifications/');
ws.onopen = () => console.log('Connected');
ws.onmessage = (event) => console.log(JSON.parse(event.data));
ws.onerror = (error) => console.error('Error:', error);
ws.onclose = (event) => console.log('Closed:', event.code);
```

### Expected Behavior

1. **Authenticated User**: Connection accepted, messages received
2. **Unauthenticated User**: Connection closed with code 4003
3. **Invalid Token**: Connection closed with code 4003
4. **No Job Access**: No messages received for inaccessible jobs

