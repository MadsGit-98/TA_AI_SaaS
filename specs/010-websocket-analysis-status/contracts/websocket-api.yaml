## Client → Server Messages

**Note**: Initial implementation does NOT require client → server messages. Subscription is implicit based on user ownership and job access permissions.

Future extensions may support:
- Explicit subscription to specific jobs
- Heartbeat/ping messages
- Acknowledgment of message receipt

---

## Error Handling

### Connection Errors

**WebSocket Close Codes**:

| Code | Meaning | Client Action |
|------|---------|---------------|
| 1000 | Normal closure | No action (user initiated) |
| 1001 | Going away | Reconnect (server shutdown) |
| 1006 | Abnormal closure | Reconnect (network issue) |
| 4003 | Forbidden | Redirect to login (auth failed) |

### Message Errors

**Invalid JSON**:
```json
{
  "type": "error",
  "data": {
    "error_code": "INVALID_JSON",
    "error_message": "Failed to parse message as JSON"
  }
}
```

**Invalid Message Type**:
```json
{
  "type": "error",
  "data": {
    "error_code": "UNKNOWN_MESSAGE_TYPE",
    "error_message": "Unknown message type: xyz"
  }
}
```

---

## Rate Limiting

### Server → Client

**Progress Updates**: Maximum 10 messages per minute per job (milestone-based)

**Rationale**: Milestone checkpoints (0%, 25%, 50%, 75%, 90%, 100%) naturally limit frequency

### Client → Server

**Not Applicable**: Initial implementation does not require client messages

---

## Security Considerations

### Authentication

- JWT token MUST be present in cookies
- Token MUST be valid and not expired
- Unauthenticated connections MUST be closed with code 4003

### Authorization

- User MUST own job OR have staff status
- User MUST NOT receive updates for jobs they don't have access to
- Group naming includes both job_id and user_id for isolation

### Data Validation

- All UUIDs MUST be validated before use
- All integers MUST be validated for range
- All timestamps MUST be validated for format

### Rate Limiting

- Implement per-user rate limiting on server side
- Prevent abuse via excessive connection attempts
- Monitor Redis memory usage for channel layer

---

## Performance Considerations

### Message Size

**Average Message Size**: ~300 bytes (JSON, minified)

**Estimated Bandwidth**:
- 10 messages/analysis × 300 bytes = 3 KB per analysis
- 100 concurrent analyses = 300 KB total

### Connection Limits

**Per User**: Maximum 10 concurrent connections (multi-tab support)

**Per Server**: Configurable based on deployment (default: 1000 concurrent connections)

### Redis Configuration

**Recommended**:
```python
CHANNEL_LAYERS = {
    "default": {
        "BACKEND": "channels_redis.core.RedisChannelLayer",
        "CONFIG": {
            "hosts": [("127.0.0.1", 6379)],
            "capacity": 1500,  # Max messages per channel
            "expiry": 10,      # Message expiry in seconds
        },
    },
}
```

